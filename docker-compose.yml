services:
  # network_mode: host lets livekit-server bind its UDP media port range
  # directly, instead of relying on Docker's per-port NAT for a 100+ port
  # UDP range - the latter is what causes "ICE failed" even when signaling
  # (the WebSocket) connects fine. Requires Linux; on macOS/Windows you'd
  # need a different approach (e.g. a real node_ip + explicit port mapping).
  livekit-server:
    image: livekit/livekit-server:latest
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit-server/config.yaml:/etc/livekit.yaml:ro

  agent:
    build: ./agent
    network_mode: host
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret1234567890devsecret12345
      # vLLM-Omni runs externally (it needs its own GPU host) - point this
      # at wherever you started `vllm-omni serve`, e.g. http://<gpu-host>:8000/v1
      VLLM_OMNI_BASE_URL: ${VLLM_OMNI_BASE_URL:?set VLLM_OMNI_BASE_URL in .env}
      VLLM_OMNI_MODEL: ${VLLM_OMNI_MODEL:?set VLLM_OMNI_MODEL in .env}
    depends_on:
      - livekit-server

  frontend:
    build: ./frontend
    network_mode: host
    environment:
      # This is handed to the browser as-is (see agent-starter-react's
      # app/api/token route), so it must be reachable from your machine.
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret1234567890devsecret12345
    depends_on:
      - livekit-server
